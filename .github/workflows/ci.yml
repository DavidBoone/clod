name: CI

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch upstream changes (Debian, NodeSource, vendor repos)
  workflow_dispatch:

jobs:
  # Exercise the host launcher with Apple's Bash and BSD utilities, without
  # needing a Docker daemon on the macOS runner.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash test/host.sh

  # test/run.sh holds the tests; each job runs some of them. Each job builds the
  # base image before its tests, so the quick variants share one.
  lint-classic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash test/host.sh
      - run: test/run.sh lint classic

  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y direnv zsh
      - run: test/run.sh base

  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: [variant-browser, variant-lamp, variant-rust, variant-dotnet variant-python variant-go+sudo, other-base devcontainer]
    steps:
      - uses: actions/checkout@v4
      # the devcontainer CLI, which clod runs on the host to build devcontainers
      - if: contains(matrix.tests, 'devcontainer')
        run: sudo npm install -g @devcontainers/cli
      - run: test/run.sh ${{ matrix.tests }}
