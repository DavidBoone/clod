name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch upstream changes (Debian, NodeSource, vendor repos)
  workflow_dispatch:

jobs:
  # test/run.sh holds the tests; each job runs one group of them, or one variant.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run.sh lint

  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run.sh base

  classic-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run.sh classic

  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [browser, docker, dotnet, go, lamp, python, rust, sudo, go+sudo]
    steps:
      - uses: actions/checkout@v4
      - run: test/run.sh variant-${{ matrix.image }}
